<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. - AI Voice Assistant</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
    
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #00f0ff;
      overflow-x: hidden;
      user-select: none;
    }

    .arc-reactor {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.5), inset 0 0 35px rgba(0, 240, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .arc-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px dashed rgba(0, 240, 255, 0.7);
      animation: spin 8s linear infinite;
    }

    .listening .arc-ring {
      animation: spin 2s linear infinite;
      border-color: #00f0ff;
    }

    .thinking .arc-ring {
      animation: spin 0.5s linear infinite;
      border-color: #eab308;
    }

    .speaking .arc-reactor {
      box-shadow: 0 0 80px rgba(16, 185, 129, 0.9);
    }

    .speaking .arc-ring {
      border-color: #10b981;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="flex flex-col h-screen max-w-lg mx-auto border-x border-cyan-900/30">

  <header class="p-4 flex items-center justify-between border-b border-cyan-900/40 bg-gray-950/80 backdrop-blur">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-atom text-cyan-400 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-widest text-cyan-400">J.A.R.V.I.S.</h1>
    </div>
    <button id="key-btn" class="px-3 py-1 text-xs rounded border border-cyan-500/50 text-cyan-300 hover:bg-cyan-950 transition">
      SET API KEY
    </button>
  </header>

  <div class="flex-1 flex flex-col items-center justify-center p-6">
    <div id="reactor-container" class="arc-reactor bg-gray-900/40 border-2 border-cyan-500/60">
      <div class="arc-ring"></div>
      <div id="reactor-core" class="w-28 h-28 rounded-full bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center shadow-lg">
        <i id="core-icon" class="fa-solid fa-microphone text-4xl text-cyan-300"></i>
      </div>
    </div>
    <p id="sub-status" class="mt-8 text-base text-cyan-400/80 tracking-widest font-semibold uppercase">Tap Core to Speak</p>
  </div>

  <div id="chat-container" class="h-48 p-4 overflow-y-auto space-y-3 bg-gray-950/90 border-t border-cyan-900/40 text-sm">
    <div class="p-2.5 rounded border border-cyan-500/20 bg-cyan-950/30 text-cyan-300">
      <strong class="block text-xs text-cyan-400 uppercase tracking-wider mb-1">System</strong>
      J.A.R.V.I.S. online. Set your free OpenRouter key to begin.
    </div>
  </div>

  <footer class="p-3 border-t border-cyan-900/40 bg-gray-950 flex items-center space-x-2">
    <input type="text" id="text-input" placeholder="Type command..." class="flex-1 bg-gray-900 border border-cyan-800/60 rounded px-3 py-2 text-sm text-cyan-100 placeholder-cyan-700 focus:outline-none focus:border-cyan-400" />
    <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-gray-950 font-bold px-4 py-2 rounded text-sm transition">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </footer>

  <script>
    const reactorContainer = document.getElementById('reactor-container');
    const coreIcon = document.getElementById('core-icon');
    const subStatus = document.getElementById('sub-status');
    const chatContainer = document.getElementById('chat-container');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const keyBtn = document.getElementById('key-btn');

    let apiKey = localStorage.getItem('openrouter_key') || '';
    let recognition = null;
    let isListening = false;

    if (apiKey) keyBtn.textContent = 'KEY SAVED';

    keyBtn.addEventListener('click', () => {
      const input = prompt('Enter your free OpenRouter API key (sk-or-v1-...):', apiKey);
      if (input !== null) {
        apiKey = input.trim();
        localStorage.setItem('openrouter_key', apiKey);
        keyBtn.textContent = apiKey ? 'KEY SAVED' : 'SET API KEY';
      }
    });

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        setVisualState('listening', 'Listening...', 'fa-microphone');
      };

      recognition.onresult = (e) => {
        handleUserMessage(e.results[0][0].transcript);
      };

      recognition.onerror = recognition.onend = () => {
        isListening = false;
        if (!document.body.classList.contains('thinking') && !document.body.classList.contains('speaking')) {
          setVisualState('ready', 'Tap Core to Speak', 'fa-microphone');
        }
      };
    }

    function setVisualState(state, subText, iconClass) {
      document.body.className = document.body.className.replace(/listening|thinking|speaking/g, '');
      if (state !== 'ready') document.body.classList.add(state);
      subStatus.textContent = subText;
      coreIcon.className = `fa-solid ${iconClass} text-4xl text-cyan-300`;
    }

    function appendMessage(sender, text) {
      const div = document.createElement('div');
      const isUser = sender === 'User';
      div.className = `p-2.5 rounded border ${isUser ? 'border-indigo-500/20 bg-indigo-950/30 text-indigo-300 ml-6' : 'border-cyan-500/20 bg-cyan-950/30 text-cyan-300 mr-6'}`;
      div.innerHTML = `<strong class="block text-xs ${isUser ? 'text-indigo-400' : 'text-cyan-400'} uppercase tracking-wider mb-1">${sender}</strong>${text}`;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleUserMessage(prompt) {
      if (!prompt.trim()) return;
      if (!apiKey) {
        alert('Please click SET API KEY in the top right and enter your OpenRouter key!');
        return;
      }

      appendMessage('User', prompt);
      setVisualState('thinking', 'Processing...', 'fa-brain');

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'google/gemini-2.0-flash-lite-001',
            messages: [
              { role: 'system', content: 'You are J.A.R.V.I.S., a witty and intelligent AI assistant. Keep responses brief, direct, and conversational.' },
              { role: 'user', content: prompt }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;
        appendMessage('J.A.R.V.I.S.', reply);
        speakResponse(reply);
      } catch (err) {
        appendMessage('J.A.R.V.I.S.', 'Connection error. Check your API key.');
        setVisualState('ready', 'Tap Core to Speak', 'fa-microphone');
      }
    }

    function speakResponse(text) {
      setVisualState('speaking', 'Responding...', 'fa-volume-high');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = utterance.onerror = () => {
          setVisualState('ready', 'Tap Core to Speak', 'fa-microphone');
        };
        window.speechSynthesis.speak(utterance);
      } else {
        setVisualState('ready', 'Tap Core to Speak', 'fa-microphone');
      }
    }

    reactorContainer.addEventListener('click', () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (recognition) {
        isListening ? recognition.stop() : recognition.start();
      } else {
        alert("Speech recognition isn't supported on this browser. Use text input below.");
      }
    });

    sendBtn.addEventListener('click', () => {
      const val = textInput.value;
      textInput.value = '';
      handleUserMessage(val);
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = textInput.value;
        textInput.value = '';
        handleUserMessage(val);
      }
    });
  </script>
</body>
  </html>
