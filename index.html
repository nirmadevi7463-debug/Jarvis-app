<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. - AI Voice Assistant</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Puter.js SDK (Free AI Access without API Key) -->
  <script src="https://js.puter.com/v2/"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
    
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #00f0ff;
      overflow-x: hidden;
      user-select: none;
    }

    /* Arc Reactor Glowing Styles */
    .arc-reactor {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4), inset 0 0 30px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .arc-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px dashed rgba(0, 240, 255, 0.6);
      animation: spin 10s linear infinite;
    }

    .listening .arc-ring {
      animation: spin 2s linear infinite;
      border-color: #00f0ff;
    }

    .thinking .arc-ring {
      animation: spin 0.6s linear infinite;
      border-color: #eab308;
    }

    .speaking .arc-reactor {
      box-shadow: 0 0 70px rgba(16, 185, 129, 0.8);
    }

    .speaking .arc-ring {
      border-color: #10b981;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #00f0ff;
      border-radius: 3px;
    }
  </style>
</head>
<body class="flex flex-col h-screen max-w-lg mx-auto border-x border-cyan-900/30">

  <!-- Header -->
  <header class="p-4 flex items-center justify-between border-b border-cyan-900/40 bg-gray-950/80 backdrop-blur">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-microchip text-cyan-400 text-xl"></i>
      <h1 class="text-xl font-bold tracking-widest text-cyan-400">J.A.R.V.I.S.</h1>
    </div>
    <div id="status-badge" class="px-3 py-1 text-xs rounded-full border border-cyan-500/30 text-cyan-400 bg-cyan-950/40 uppercase tracking-widest">
      READY
    </div>
  </header>

  <!-- Arc Reactor Section -->
  <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
    <div id="reactor-container" class="arc-reactor bg-gray-900/40 border-2 border-cyan-500/50">
      <div class="arc-ring"></div>
      <div id="reactor-core" class="w-24 h-24 rounded-full bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center shadow-lg">
        <i id="core-icon" class="fa-solid fa-microphone text-3xl text-cyan-300"></i>
      </div>
    </div>
    <p id="sub-status" class="mt-6 text-sm text-cyan-400/70 tracking-widest font-semibold uppercase">Tap Core to Speak</p>
  </div>

  <!-- Chat Log -->
  <div id="chat-container" class="h-56 p-4 overflow-y-auto space-y-3 bg-gray-950/90 border-t border-cyan-900/40 text-sm">
    <div class="p-2.5 rounded border border-cyan-500/20 bg-cyan-950/30 text-cyan-300">
      <strong class="block text-xs text-cyan-400 uppercase tracking-wider mb-1">System</strong>
      Greetings! I am J.A.R.V.I.S. Tap the core and speak to begin.
    </div>
  </div>

  <!-- Manual Input Footer -->
  <footer class="p-3 border-t border-cyan-900/40 bg-gray-950 flex items-center space-x-2">
    <input type="text" id="text-input" placeholder="Type a message..." class="flex-1 bg-gray-900 border border-cyan-800/60 rounded px-3 py-2 text-sm text-cyan-100 placeholder-cyan-700 focus:outline-none focus:border-cyan-400" />
    <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-gray-950 font-bold px-4 py-2 rounded text-sm transition">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </footer>

  <script>
    // State DOM elements
    const reactorContainer = document.getElementById('reactor-container');
    const reactorCore = document.getElementById('reactor-core');
    const coreIcon = document.getElementById('core-icon');
    const statusBadge = document.getElementById('status-badge');
    const subStatus = document.getElementById('sub-status');
    const chatContainer = document.getElementById('chat-container');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');

    let recognition = null;
    let isListening = false;
    let conversationHistory = [];

    // Initialize Web Speech API for Recognition
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        setVisualState('listening', 'LISTENING...', 'Listening to voice...', 'fa-microphone');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleUserMessage(transcript);
      };

      recognition.onerror = () => {
        setVisualState('ready', 'READY', 'Tap Core to Speak', 'fa-microphone');
        isListening = false;
      };

      recognition.onend = () => {
        isListening = false;
      };
    }

    // Controls Visual State Changes
    function setVisualState(state, badgeText, subText, iconClass) {
      document.body.className = document.body.className.replace(/listening|thinking|speaking/g, '');
      if (state !== 'ready') document.body.classList.add(state);
      statusBadge.textContent = badgeText;
      subStatus.textContent = subText;
      coreIcon.className = `fa-solid ${iconClass} text-3xl text-cyan-300`;
    }

    // Append Message to Log
    function appendMessage(sender, text) {
      const div = document.createElement('div');
      const isUser = sender === 'User';
      div.className = `p-2.5 rounded border ${isUser ? 'border-indigo-500/20 bg-indigo-950/30 text-indigo-300 ml-6' : 'border-cyan-500/20 bg-cyan-950/30 text-cyan-300 mr-6'}`;
      div.innerHTML = `<strong class="block text-xs ${isUser ? 'text-indigo-400' : 'text-cyan-400'} uppercase tracking-wider mb-1">${sender}</strong>${text}`;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Process Message with Puter.js AI Gateway
    async function handleUserMessage(prompt) {
      if (!prompt.trim()) return;
      
      appendMessage('User', prompt);
      setVisualState('thinking', 'PROCESSING', 'Thinking...', 'fa-brain');

      conversationHistory.push({ role: 'user', content: prompt });

      try {
        // Send request to Puter AI (Free access to AI backend)
        const response = await puter.ai.chat(prompt, { model: 'claude-3-5-sonnet' });
        const reply = typeof response === 'string' ? response : response.message.content;
        
        appendMessage('J.A.R.V.I.S.', reply);
        speakResponse(reply);
      } catch (err) {
        // Fallback to basic model if primary stream busy
        try {
          const fallbackResponse = await puter.ai.chat(prompt);
          const reply = typeof fallbackResponse === 'string' ? fallbackResponse : fallbackResponse.message.content;
          appendMessage('J.A.R.V.I.S.', reply);
          speakResponse(reply);
        } catch (error) {
          appendMessage('J.A.R.V.I.S.', 'Systems experiencing minor interference. Please try again.');
          setVisualState('ready', 'READY', 'Tap Core to Speak', 'fa-microphone');
        }
      }
    }

    // Speech Synthesis Output
    function speakResponse(text) {
      setVisualState('speaking', 'SPEAKING', 'JARVIS responding...', 'fa-volume-high');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        utterance.onend = () => {
          setVisualState('ready', 'READY', 'Tap Core to Speak', 'fa-microphone');
        };

        utterance.onerror = () => {
          setVisualState('ready', 'READY', 'Tap Core to Speak', 'fa-microphone');
        };

        window.speechSynthesis.speak(utterance);
      } else {
        setVisualState('ready', 'READY', 'Tap Core to Speak', 'fa-microphone');
      }
    }

    // Click Core Event Handler
    reactorContainer.addEventListener('click', () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      if (recognition) {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      } else {
        alert("Speech recognition is not supported on this browser. Please use text input below.");
      }
    });

    // Text Input Actions
    sendBtn.addEventListener('click', () => {
      const val = textInput.value;
      textInput.value = '';
      handleUserMessage(val);
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = textInput.value;
        textInput.value = '';
        handleUserMessage(val);
      }
    });
  </script>
</body>
</html>
